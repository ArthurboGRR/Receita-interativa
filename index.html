<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receita Interativa</title>
</head>
<body>
    <header>
        <h1>Pão de Queijo Mineiro Tradicional</h1>
        <p>
            Uma receita tradicional de Minas Gerais:
        crocante por fora e macia por dentro.
        </p>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUwvpiGpdNirdroncfzgiQ9DbKUCjVEc0jBi8mGnWSTA&s=10" alt="Pães de queijo">
    </header>

    <section>
        <button popovertarget="segredo">
            Ver segredo do Chef
        </button>
        <div id="segredo" popover>
            <h2>O segredo da Receita</h2>
            <p>Evite adicionar os ovos enquanto a massa ainda estiver muito quente.</p>
        </div>
    </section>
</body>
</html>
